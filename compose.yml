# FinanzKlee auf dem Server: Caddy (HTTPS) → App → PostgreSQL
# Starten:  docker compose up -d --build
# Anleitung: docs/BETRIEB.md
#
# Werte kommen aus der .env im selben Ordner (DOMAIN, POSTGRES_PASSWORD, IMPRESSUM_* …).
# Nur Caddy ist von außen erreichbar. App und Datenbank haben bewusst keine "ports:",
# sonst wären sie am Firewall (ufw) vorbei aus dem Internet erreichbar.

name: finanzklee

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finanzklee
      POSTGRES_DB: finanzklee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in der .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzklee -d finanzklee"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: finanzklee-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Überschreibt DATABASE_URL aus der .env: im Docker-Netz heißt die Datenbank "db"
      DATABASE_URL: postgresql://finanzklee:${POSTGRES_PASSWORD}@db:5432/finanzklee
      APP_URL: https://${DOMAIN:?DOMAIN fehlt in der .env}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
