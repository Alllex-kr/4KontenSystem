# Prüft Pull Requests: Typecheck, Tests, Migrationen, Build.
# Bei Pushes auf main ruft deploy.yml diese Prüfung auf und rollt nur aus, wenn sie grün ist.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Prüfen und bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finanzklee
          POSTGRES_PASSWORD: finanzklee
          POSTGRES_DB: finanzklee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finanzklee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://finanzklee:finanzklee@localhost:5432/finanzklee
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Migrationen einspielen
        run: npx prisma migrate deploy

      - name: Schema und Migrationen stimmen überein
        # Schlägt fehl, wenn prisma/schema.prisma geändert wurde, ohne eine Migration anzulegen
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://finanzklee:finanzklee@localhost:5432/postgres" \
            --exit-code \
          || { echo "::error::Das Schema wurde geändert, aber es fehlt eine Migration. Lokal ausführen: npm run db:migrate -- --name beschreibung"; exit 1; }

      - name: Build
        run: npm run build

      - name: Sicherheitslücken in Paketen (nur Laufzeit, hoch/kritisch)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit meldet Sicherheitslücken, bitte prüfen."
